services:
  - docker:dind

variables:
  DOCKER_HOST: tcp://docker:2375
  DOCKER_DRIVER: overlay2
  IMAGE_TAG: $CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG

include:
  - "/pulp.yml"

stages:
  - self-test

self-test:
  extends:
    - .pulp-startup
  stage: self-test
  image: centos:7.4.1708
  tags:
    - share
