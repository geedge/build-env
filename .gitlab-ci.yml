image: quay.io/containers/buildah

variables:
  ROCKY8_IMAGE: $CI_REGISTRY_IMAGE:rocky8-aarch64
  ROCKY9_IMAGE: $CI_REGISTRY_IMAGE:rocky9-aarch64

before_script:
  - buildah login -u gitlab-ci-token -p $CI_JOB_TOKEN $CI_REGISTRY

build_for_rocky8:
  stage: build
  script:
    - buildah build -f ./docker/rocky8/Dockerfile -t $ROCKY8_IMAGE .
    - buildah push $ROCKY8_IMAGE
  tags:
    - tsg-os-builder-aarch64

build_for_rocky9:
  stage: build
  script:
    - buildah build -f ./docker/rocky9/Dockerfile -t $ROCKY9_IMAGE .
    - buildah push $ROCKY9_IMAGE
  tags:
    - tsg-os-builder-aarch64