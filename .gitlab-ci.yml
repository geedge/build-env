image: quay.io/containers/buildah

variables:
  ROCKY9_IMAGE: $CI_REGISTRY_IMAGE:rocky9-x86-64

before_script:
  - buildah login -u gitlab-ci-token -p $CI_JOB_TOKEN $CI_REGISTRY
  
build_for_rocky9:
  stage: build
  script:
    - buildah build -f ./rocky9/Dockerfile -t $ROCKY9_IMAGE .
    - buildah push $ROCKY9_IMAGE
  tags:
    - share